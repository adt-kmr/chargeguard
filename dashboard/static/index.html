<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChargeGuard — EV Security Operations Centre</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>

<style>
/* ── Reset & tokens ──────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:        #f0f4ff;
  --surface:   #ffffff;
  --surface2:  #f8faff;
  --border:    #e2e8f7;
  --border2:   #c7d4f0;
  --text:      #1e293b;
  --text2:     #475569;
  --text3:     #94a3b8;
  --blue:      #2563eb;
  --blue-l:    #dbeafe;
  --green:     #16a34a;
  --green-l:   #dcfce7;
  --amber:     #d97706;
  --amber-l:   #fef3c7;
  --red:       #dc2626;
  --red-l:     #fee2e2;
  --purple:    #7c3aed;
  --cyan:      #0284c7;
  --shadow:    0 1px 4px rgba(37,99,235,.08), 0 4px 16px rgba(37,99,235,.06);
  --shadow-lg: 0 4px 24px rgba(37,99,235,.12);
  --radius:    10px;
  --header-h:  54px;
  --bottom-h:  210px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:13px}

/* ── Layout ──────────────────────────────────────────────────────────────── */
#app{display:grid;height:100vh;
  grid-template-rows:var(--header-h) 1fr var(--bottom-h)}

header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:1rem;padding:0 1.25rem;
  box-shadow:0 1px 8px rgba(37,99,235,.07);
  position:relative;z-index:10;
}
.logo{
  display:flex;align-items:center;gap:0.6rem;
  font-size:1.1rem;font-weight:800;letter-spacing:.02em;color:var(--blue);
}
.logo-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;
}
.logo span{color:var(--purple)}
.tagline{font-size:.72rem;color:var(--text3);font-weight:500;letter-spacing:.03em}

.header-status{
  margin-left:auto;display:flex;align-items:center;gap:.75rem;
}
.status-pill{
  display:flex;align-items:center;gap:.35rem;
  padding:.28rem .7rem;border-radius:999px;font-size:.7rem;font-weight:700;
  letter-spacing:.04em;border:1.5px solid;
}
.status-pill.standby{background:var(--blue-l);color:var(--blue);border-color:#bfdbfe}
.status-pill.running{background:#fef9c3;color:#854d0e;border-color:#fde68a}
.status-pill.done-green{background:var(--green-l);color:var(--green);border-color:#bbf7d0}
.status-pill.done-amber{background:var(--amber-l);color:var(--amber);border-color:#fde68a}
.status-pill.done-red{background:var(--red-l);color:var(--red);border-color:#fecaca}
.pulse-dot{
  width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:none;
}
.pulse-dot.pulsing{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

.session-id{font-size:.65rem;color:var(--text3);font-family:monospace}

/* ── Main row ────────────────────────────────────────────────────────────── */
.main-row{display:grid;grid-template-columns:270px 1fr 310px;overflow:hidden}

/* ── Left panel ──────────────────────────────────────────────────────────── */
.panel-left{
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:0;overflow-y:auto;
}
.panel-section{padding:.85rem 1rem;border-bottom:1px solid var(--border)}
.panel-section:last-child{border-bottom:none;flex:1}

.section-title{
  font-size:.62rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text3);margin-bottom:.6rem;
  display:flex;align-items:center;gap:.4rem;
}
.section-title::before{
  content:'';width:3px;height:10px;border-radius:2px;background:var(--blue);
}

/* Verdict ring */
.verdict-wrap{display:flex;flex-direction:column;align-items:center;gap:.7rem;padding:.5rem 0}
.ring-svg-wrap{position:relative;width:120px;height:120px}
.ring-svg-wrap svg{transform:rotate(-90deg);width:100%;height:100%}
.ring-track{fill:none;stroke:#e2e8f7;stroke-width:10}
.ring-fill{
  fill:none;stroke-width:10;stroke-linecap:round;
  stroke-dasharray:339;stroke-dashoffset:339;
  transition:stroke-dashoffset .7s ease,stroke .4s ease;stroke:#94a3b8;
}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
}
.ring-verdict-label{font-size:.6rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text3)}
.ring-score{font-size:1.4rem;font-weight:800;color:var(--text)}
.verdict-text{font-size:.72rem;color:var(--text2);text-align:center;
  line-height:1.5;padding:0 .5rem}

/* Check list */
.check-list{display:flex;flex-direction:column;gap:.4rem}
.check-row{
  display:flex;align-items:flex-start;gap:.6rem;
  padding:.55rem .65rem;border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface2);
  transition:all .3s ease;opacity:.45;
}
.check-row.active{opacity:1;border-color:#bfdbfe;background:#eff6ff}
.check-row.pass{opacity:1;border-color:#bbf7d0;background:#f0fdf4}
.check-row.fail{opacity:1;border-color:#fecaca;background:#fff5f5}
.check-row.warning{opacity:1;border-color:#fde68a;background:#fffbeb}

.check-dot{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:.7rem;
  background:var(--border);color:var(--text3);
}
.check-row.active .check-dot{background:#dbeafe;color:var(--blue)}
.check-row.pass .check-dot{background:#dcfce7;color:var(--green)}
.check-row.fail .check-dot{background:#fee2e2;color:var(--red)}
.check-row.warning .check-dot{background:#fef3c7;color:var(--amber)}

.check-row-body{flex:1;min-width:0}
.check-row-name{font-weight:600;font-size:.75rem;color:var(--text)}
.check-row-detail{font-size:.67rem;color:var(--text2);margin-top:1px;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check-row-time{font-size:.62rem;color:var(--text3);margin-top:1px;
  font-variant-numeric:tabular-nums}

/* Alert feed */
.alert-list{display:flex;flex-direction:column;gap:.3rem;max-height:120px;overflow-y:auto}
.alert-item{
  display:flex;gap:.5rem;align-items:flex-start;
  padding:.4rem .5rem;border-radius:6px;font-size:.67rem;
  animation:slideIn .3s ease;
}
.alert-item.info{background:#eff6ff;color:#1e40af}
.alert-item.warn{background:#fffbeb;color:#78350f}
.alert-item.crit{background:#fff5f5;color:#7f1d1d}
.alert-time{font-size:.6rem;color:var(--text3);white-space:nowrap;margin-top:1px}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ── 3D scene ────────────────────────────────────────────────────────────── */
.scene-container{position:relative;overflow:hidden;background:#dbeafe}
#three-canvas{display:block;width:100%;height:100%}

/* HUD overlays */
.scene-hud{
  position:absolute;inset:0;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:.75rem;
}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start}
.hud-bottom{display:flex;justify-content:center;gap:.75rem}

.hud-badge{
  background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.9);border-radius:8px;
  padding:.4rem .75rem;font-size:.7rem;font-weight:600;color:var(--text2);
  box-shadow:0 2px 8px rgba(37,99,235,.1);
}
.hud-badge .hud-val{font-size:.85rem;font-weight:800;color:var(--blue);display:block}

.node-label{
  background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
  border-radius:6px;padding:.25rem .55rem;font-size:.65rem;font-weight:700;
  border:1px solid rgba(255,255,255,.95);box-shadow:0 2px 6px rgba(0,0,0,.08);
  display:flex;align-items:center;gap:.35rem;
}
.node-label .dot{width:7px;height:7px;border-radius:50%}

.hud-timer{
  background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.95);border-radius:8px;
  padding:.4rem .75rem;text-align:center;min-width:120px;
  box-shadow:0 2px 8px rgba(37,99,235,.1);
}
.hud-timer-label{font-size:.6rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text3)}
.hud-timer-val{font-size:1.1rem;font-weight:800;color:var(--text);
  font-variant-numeric:tabular-nums}
.timer-bar{height:3px;background:#e2e8f7;border-radius:2px;
  margin-top:.3rem;overflow:hidden}
.timer-bar-fill{height:100%;border-radius:2px;width:0%;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  transition:width .1s linear}

/* ── Right panel ─────────────────────────────────────────────────────────── */
.panel-right{
  background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;
}
.ctrl-header{
  padding:.75rem 1rem .5rem;border-bottom:1px solid var(--border);
  font-size:.65rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text3);
}
.ctrl-scroll{flex:1;overflow-y:auto;padding:.75rem 1rem}
.ctrl-scroll::-webkit-scrollbar{width:4px}
.ctrl-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* Preset buttons */
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.85rem}
.preset-btn{
  padding:.5rem .6rem;border-radius:7px;border:1.5px solid var(--border);
  background:var(--surface2);cursor:pointer;text-align:left;
  transition:all .2s;
}
.preset-btn:hover{border-color:var(--blue);background:#eff6ff}
.preset-btn.selected{border-color:var(--blue);background:#eff6ff}
.preset-btn .pb-act{font-size:.6rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text3);display:block;margin-bottom:1px}
.preset-btn .pb-name{font-size:.72rem;font-weight:600;color:var(--text)}
.preset-btn.healthy.selected .pb-name{color:var(--green)}
.preset-btn.tampered.selected .pb-name{color:var(--red)}
.preset-btn.vulnerable.selected .pb-name{color:var(--amber)}
.preset-btn.compromised.selected .pb-name{color:var(--red)}
.preset-btn.custom.selected .pb-name{color:var(--purple)}

/* Control sections */
.ctrl-section{margin-bottom:.85rem}
.ctrl-section-title{
  font-size:.62rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text3);margin-bottom:.5rem;
  display:flex;align-items:center;gap:.4rem;
}
.ctrl-section-title .cs-icon{
  width:16px;height:16px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-size:.65rem;
}
.cs-purple .cs-icon{background:#ede9fe;color:var(--purple)}
.cs-blue   .cs-icon{background:#dbeafe;color:var(--blue)}
.cs-amber  .cs-icon{background:#fef3c7;color:var(--amber)}
.cs-green  .cs-icon{background:#dcfce7;color:var(--green)}
.cs-red    .cs-icon{background:#fee2e2;color:var(--red)}

/* Radio groups */
.radio-group{display:flex;flex-direction:column;gap:.3rem}
.radio-label{
  display:flex;align-items:flex-start;gap:.55rem;
  padding:.45rem .6rem;border-radius:7px;border:1.5px solid var(--border);
  cursor:pointer;transition:all .18s;background:var(--surface2);
}
.radio-label:hover{border-color:var(--blue-l);background:#f8fbff}
.radio-label input[type=radio]{display:none}
.radio-label.checked{border-color:var(--blue);background:#eff6ff}
.radio-label.checked.attack-active{border-color:var(--red);background:#fff5f5}
.radio-mark{
  width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);
  flex-shrink:0;margin-top:1px;transition:all .15s;
  display:flex;align-items:center;justify-content:center;
}
.radio-label.checked .radio-mark{border-color:var(--blue);background:var(--blue)}
.radio-label.checked.attack-active .radio-mark{border-color:var(--red);background:var(--red)}
.radio-mark::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff;display:none}
.radio-label.checked .radio-mark::after{display:block}
.radio-body{flex:1;min-width:0}
.radio-name{font-size:.72rem;font-weight:600;color:var(--text)}
.radio-desc{font-size:.62rem;color:var(--text3);margin-top:1px;line-height:1.3}

/* Checkboxes (CVE) */
.cve-list{display:flex;flex-direction:column;gap:.3rem}
.cve-label{
  display:flex;align-items:center;gap:.5rem;padding:.42rem .6rem;
  border-radius:7px;border:1.5px solid var(--border);cursor:pointer;
  transition:all .18s;background:var(--surface2);
}
.cve-label:hover{border-color:var(--amber-l);background:#fffbeb}
.cve-label input[type=checkbox]{display:none}
.cve-check{
  width:14px;height:14px;border-radius:3px;border:2px solid var(--border2);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.cve-label.checked .cve-check{background:var(--amber);border-color:var(--amber);color:#fff}
.cve-label.checked{border-color:#fde68a;background:#fffbeb}
.cve-info{flex:1}
.cve-id{font-size:.7rem;font-weight:700;font-family:monospace;color:var(--text)}
.cve-meta{font-size:.62rem;color:var(--text3)}
.cve-sev{
  font-size:.58rem;font-weight:700;padding:.1rem .35rem;
  border-radius:3px;letter-spacing:.05em;
}
.sev-CRITICAL{background:#fee2e2;color:var(--red)}
.sev-HIGH{background:#fef3c7;color:var(--amber)}

/* Sliders */
.slider-wrap{margin-top:.4rem}
.slider-row{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:.3rem}
.slider-label{font-size:.68rem;color:var(--text2)}
.slider-val{font-size:.72rem;font-weight:700;color:var(--blue);
  font-variant-numeric:tabular-nums;min-width:50px;text-align:right}
input[type=range]{
  width:100%;height:4px;appearance:none;border-radius:2px;
  background:linear-gradient(to right,var(--blue) 0%,var(--blue) var(--pct,50%),
    var(--border2) var(--pct,50%),var(--border2) 100%);
  cursor:pointer;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--blue);border:2px solid #fff;
  box-shadow:0 1px 4px rgba(37,99,235,.4);
}

/* Text input */
.ctrl-input{
  width:100%;padding:.42rem .6rem;border-radius:7px;
  border:1.5px solid var(--border);background:var(--surface2);
  font-size:.72rem;color:var(--text);outline:none;
  transition:border-color .15s;
}
.ctrl-input:focus{border-color:var(--blue);background:#fff}

/* Verify button */
.ctrl-footer{padding:.75rem 1rem;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:.5rem}
.btn-verify{
  padding:.75rem;border:none;border-radius:9px;cursor:pointer;
  background:linear-gradient(135deg,var(--blue) 0%,var(--purple) 100%);
  color:#fff;font-size:.85rem;font-weight:700;letter-spacing:.02em;
  transition:opacity .2s,transform .1s;box-shadow:0 3px 12px rgba(37,99,235,.35);
}
.btn-verify:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
.btn-verify:active:not(:disabled){transform:translateY(0)}
.btn-verify:disabled{opacity:.45;cursor:not-allowed}

.btn-evidence{
  padding:.6rem;border-radius:9px;cursor:pointer;
  border:1.5px solid var(--green);background:var(--green-l);
  color:var(--green);font-size:.8rem;font-weight:700;
  display:none;transition:background .2s;
}
.btn-evidence:hover{background:#bbf7d0}
.btn-evidence.visible{display:block}
