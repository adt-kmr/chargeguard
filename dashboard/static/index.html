<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChargeGuard — EV Security Operations Centre</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }

<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>

<style>
/* ── Reset & tokens ──────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:        #f0f4ff;
  --surface:   #ffffff;
  --surface2:  #f8faff;
  --border:    #e2e8f7;
  --border2:   #c7d4f0;
  --text:      #1e293b;
  --text2:     #475569;
  --text3:     #94a3b8;
  --blue:      #2563eb;
  --blue-l:    #dbeafe;
  --green:     #16a34a;
  --green-l:   #dcfce7;
  --amber:     #d97706;
  --amber-l:   #fef3c7;
  --red:       #dc2626;
  --red-l:     #fee2e2;
  --purple:    #7c3aed;
  --cyan:      #0284c7;
  --shadow:    0 1px 4px rgba(37,99,235,.08), 0 4px 16px rgba(37,99,235,.06);
  --shadow-lg: 0 4px 24px rgba(37,99,235,.12);
  --radius:    10px;
  --header-h:  54px;
  --bottom-h:  210px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:13px}

/* ── Layout ──────────────────────────────────────────────────────────────── */
#app{display:grid;height:100vh;
  grid-template-rows:var(--header-h) 1fr var(--bottom-h)}

header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:1rem;padding:0 1.25rem;
  box-shadow:0 1px 8px rgba(37,99,235,.07);
  position:relative;z-index:10;
}
.logo{
  display:flex;align-items:center;gap:0.6rem;
  font-size:1.1rem;font-weight:800;letter-spacing:.02em;color:var(--blue);
}
.logo-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;
}
.logo span{color:var(--purple)}
.tagline{font-size:.72rem;color:var(--text3);font-weight:500;letter-spacing:.03em}

.header-status{
  margin-left:auto;display:flex;align-items:center;gap:.75rem;
}
.status-pill{
  display:flex;align-items:center;gap:.35rem;
  padding:.28rem .7rem;border-radius:999px;font-size:.7rem;font-weight:700;
  letter-spacing:.04em;border:1.5px solid;
}
.status-pill.standby{background:var(--blue-l);color:var(--blue);border-color:#bfdbfe}
.status-pill.running{background:#fef9c3;color:#854d0e;border-color:#fde68a}
.status-pill.done-green{background:var(--green-l);color:var(--green);border-color:#bbf7d0}
.status-pill.done-amber{background:var(--amber-l);color:var(--amber);border-color:#fde68a}
.status-pill.done-red{background:var(--red-l);color:var(--red);border-color:#fecaca}
.pulse-dot{
  width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:none;
}
.pulse-dot.pulsing{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

.session-id{font-size:.65rem;color:var(--text3);font-family:monospace}

/* ── Main row ────────────────────────────────────────────────────────────── */
.main-row{display:grid;grid-template-columns:270px 1fr 310px;overflow:hidden}

/* ── Left panel ──────────────────────────────────────────────────────────── */
.panel-left{
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:0;overflow-y:auto;
}
.panel-section{padding:.85rem 1rem;border-bottom:1px solid var(--border)}
.panel-section:last-child{border-bottom:none;flex:1}

.section-title{
  font-size:.62rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text3);margin-bottom:.6rem;
  display:flex;align-items:center;gap:.4rem;
}
.section-title::before{
  content:'';width:3px;height:10px;border-radius:2px;background:var(--blue);
}

/* Verdict ring */
.verdict-wrap{display:flex;flex-direction:column;align-items:center;gap:.7rem;padding:.5rem 0}
.ring-svg-wrap{position:relative;width:120px;height:120px}
.ring-svg-wrap svg{transform:rotate(-90deg);width:100%;height:100%}
.ring-track{fill:none;stroke:#e2e8f7;stroke-width:10}
.ring-fill{
  fill:none;stroke-width:10;stroke-linecap:round;
  stroke-dasharray:339;stroke-dashoffset:339;
  transition:stroke-dashoffset .7s ease,stroke .4s ease;stroke:#94a3b8;
}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
}
.ring-verdict-label{font-size:.6rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text3)}
.ring-score{font-size:1.4rem;font-weight:800;color:var(--text)}
.verdict-text{font-size:.72rem;color:var(--text2);text-align:center;
  line-height:1.5;padding:0 .5rem}

/* Check list */
.check-list{display:flex;flex-direction:column;gap:.4rem}
.check-row{
  display:flex;align-items:flex-start;gap:.6rem;
  padding:.55rem .65rem;border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface2);
  transition:all .3s ease;opacity:.45;
}
.check-row.active{opacity:1;border-color:#bfdbfe;background:#eff6ff}
.check-row.pass{opacity:1;border-color:#bbf7d0;background:#f0fdf4}
.check-row.fail{opacity:1;border-color:#fecaca;background:#fff5f5}
.check-row.warning{opacity:1;border-color:#fde68a;background:#fffbeb}

.check-dot{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:.7rem;
  background:var(--border);color:var(--text3);
}
.check-row.active .check-dot{background:#dbeafe;color:var(--blue)}
.check-row.pass .check-dot{background:#dcfce7;color:var(--green)}
.check-row.fail .check-dot{background:#fee2e2;color:var(--red)}
.check-row.warning .check-dot{background:#fef3c7;color:var(--amber)}

.check-row-body{flex:1;min-width:0}
.check-row-name{font-weight:600;font-size:.75rem;color:var(--text)}
.check-row-detail{font-size:.67rem;color:var(--text2);margin-top:1px;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check-row-time{font-size:.62rem;color:var(--text3);margin-top:1px;
  font-variant-numeric:tabular-nums}

/* Alert feed */
.alert-list{display:flex;flex-direction:column;gap:.3rem;max-height:120px;overflow-y:auto}
.alert-item{
  display:flex;gap:.5rem;align-items:flex-start;
  padding:.4rem .5rem;border-radius:6px;font-size:.67rem;
  animation:slideIn .3s ease;
}
.alert-item.info{background:#eff6ff;color:#1e40af}
.alert-item.warn{background:#fffbeb;color:#78350f}
.alert-item.crit{background:#fff5f5;color:#7f1d1d}
.alert-time{font-size:.6rem;color:var(--text3);white-space:nowrap;margin-top:1px}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
